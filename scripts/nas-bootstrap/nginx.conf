server {
    listen 8080;
    server_name _;

    location /bootstrap/ {
        root /srv/public;
        autoindex off;
        add_header Cache-Control "no-store, max-age=0" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
